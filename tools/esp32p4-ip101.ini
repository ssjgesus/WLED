; JC-ESP32P4-M3-DEV: 16MB flash, IP101 RMII Ethernet.
[env:esp32p4_ip101]
extends = env:esp32p4_16MB
; The JC-ESP32P4-M3-DEV identifies as the generic 360 MHz P4, not the P4 EV board.
board = esp32-p4
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = ${env:esp32p4_16MB.build_flags}
  -D WLED_USE_ETHERNET
  -D WLED_ETH_DEFAULT=7
  -D BTNPIN=-1
  -D RLYPIN=-1
  -D WLED_USE_ETHERNET_ONLY
